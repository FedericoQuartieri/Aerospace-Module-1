<text x="74" y="418" class="nota">Il numero in fondo a ogni barra e' il passo intero. La colonna eta porta il termine fisico g, le altre due no: per questo non sono uguali.</text>
<text x="74" y="434" class="nota">Con piu' processi ogni stadio e' il massimo sui processi: dove la somma supera il passo, il non contato vale zero.</text>
