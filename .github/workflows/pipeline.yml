name: Pipeline correctness
on:
  push:
  pull_request:
jobs:
  equivalence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [0, 1]
        precision: [double, float]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - run: python3 scripts/test_pipeline_tools.py
      - name: Full fields and directional residuals
        run: ./scripts/check_pipeline.sh
        env:
          MPI: 1
          OMP: 1
          SIMD: ${{ matrix.simd }}
          PRECISION: ${{ matrix.precision }}
          THREADS: '1 2'
          RANKS: 4
          GRIDS: '8;7 9 5'
          PIPELINE_BATCHES: 'auto 1 3 64'
          T_END: 0.1
          OMP_WAIT_POLICY: passive
          MPIEXEC_ARGS: --oversubscribe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pipeline-${{ matrix.simd }}-${{ matrix.precision }}
          path: build/pipeline-check/
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_pipeline.sh
        env:
          SIMD: 1
          GRIDS: '7 9 5'
          PIPELINE_BATCHES: '1 3 64'
          T_END: 0.1
          EXTRA_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=0
